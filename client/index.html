  <body>
    <!-- Static fallback content in the raw HTML, not only the JS-rendered app —
         Remindly is a client-side React SPA, so a crawler that doesn't execute JS
         (e.g. Google's OAuth consent screen homepage checker) sees only whatever is
         here until React mounts and replaces it. Keep this in sync with
         LoginPage.jsx's heading/description if either changes. -->
    <div id="root">
      <h1>Remindly</h1>
      <p>
        Remindly is a voice-assisted calendar app. Create events, assign each one a
        custom AI assistant with its own personality and voice, and get spoken
        reminders when they're due. Optionally import your existing Google Calendar
        to bring your events in automatically.
      </p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
